name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Contract tests (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run contract unit tests
        run: cargo test --workspace

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Node 22 bundles npm 10, which rejects this lockfile as out of sync: it
      # wants nested optional-peer copies (utf-8-validate@5, typescript@5.9)
      # that newer peer resolution does not create. npm >= 11.5.0 accepts it;
      # see "engines" in package.json. Node 22 has no way to ship that, so the
      # global install stays until the bundled npm catches up.
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run lint
      # @barkeep/mcp is not built by vite, so its types are only checked here.
      - run: npm run typecheck
      - run: npm run build
      # Offline unit tests across every workspace: the SEP client, the
      # third-party license gate (including fixture builds), @barkeep/core's
      # no-@stellar/* constraint check, and the MCP server's tool surface. The
      # suites that need the network stay out: the mock anchor
      # (anchor.live.test.ts) and the Testnet scripts under */scripts/, which
      # are run by hand.
      - run: npm run test:unit
