name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Contract tests (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run contract unit tests
        run: cargo test --workspace

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # the lockfile is generated by npm 12; older bundled npm rejects it
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Offline unit tests: SEP client plus the third-party license gate
      # (including fixture builds). The live suite against the
      # mock anchor (anchor.live.test.ts) runs locally: `npm test`.
      - run: npm run test:unit
