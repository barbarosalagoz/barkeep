[package]
name = "barkeep-verifier-ed25519"
version = "0.1.0"
edition = "2021"
publish = false
description = "Ed25519 signature verifier contract for Barkeep smart accounts"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

# Pinned to the audited crate's requirement, not the workspace's soroban-sdk.
# See contracts/barkeep-policy/Cargo.toml for the full reasoning.
[dependencies]
soroban-sdk = "=26.1.0"
stellar-accounts = "=0.7.2"

[dev-dependencies]
soroban-sdk = { version = "=26.1.0", features = ["testutils"] }
ed25519-dalek = "2.1.1"
