[package]
name = "payment-tracker"
version = "0.1.0"
edition = "2021"
publish = false
description = "PromptRail Payment Tracker - escrowed multi-address payments with status tracking on Soroban"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
