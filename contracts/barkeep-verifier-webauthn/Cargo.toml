[package]
name = "barkeep-verifier-webauthn"
version = "0.1.0"
edition = "2021"
publish = false
description = "WebAuthn (secp256r1 passkey) verifier contract for Barkeep smart accounts"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

# Pinned to stellar-accounts' requirement, not the workspace's soroban-sdk.
# See contracts/barkeep-policy/Cargo.toml for the full reasoning.
[dependencies]
soroban-sdk = "=26.1.0"
stellar-accounts = "=0.7.2"

[dev-dependencies]
soroban-sdk = { version = "=26.1.0", features = ["testutils"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
