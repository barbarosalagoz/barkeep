[package]
name = "barkeep-smart-account"
version = "0.1.0"
edition = "2021"
publish = false
description = "Barkeep smart account: the tab, built on OpenZeppelin stellar-accounts"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

# Pinned to stellar-accounts' requirement, not the workspace's soroban-sdk.
# See contracts/barkeep-policy/Cargo.toml for the full reasoning.
[dependencies]
soroban-sdk = "=26.1.0"
stellar-accounts = "=0.7.2"

[dev-dependencies]
soroban-sdk = { version = "=26.1.0", features = ["testutils"] }
